{% extends 'base.html' %}

{% block title %}
Delete Event
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-danger text-white">

        <h3>Delete Event</h3>

    </div>

    <div class="card-body text-center">

        <h4>

            Are you sure you want to delete

            <strong>

                {{ event.title }}

            </strong>

            ?

        </h4>

        <br>

        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger">

                Delete

            </button>

            <a href="{% url 'event_list' %}" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
