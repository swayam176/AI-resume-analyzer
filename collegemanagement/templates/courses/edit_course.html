{% extends 'base.html' %}

{% block title %}
Edit Course
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning text-dark p-4">

                    <h2 class="mb-0">

                        <i class="fas fa-edit"></i>

                        Edit Course

                    </h2>

                </div>

                <div class="card-body p-5">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Course Code

                            </label>

                            {{ form.course_code }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Course Name

                            </label>

                            {{ form.course_name }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Department

                            </label>

                            {{ form.department }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Semester

                            </label>

                            {{ form.semester }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Credits

                            </label>

                            {{ form.credits }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Faculty Name

                            </label>

                            {{ form.faculty_name }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Description

                            </label>

                            {{ form.description }}

                        </div>

                        <div class="text-center mt-5">

                            <button type="submit"
                                    class="btn btn-warning btn-lg px-5">

                                <i class="fas fa-save"></i>

                                Update Course

                            </button>

                            <a href="{% url 'course_list' %}"
                               class="btn btn-secondary btn-lg px-5">

                                <i class="fas fa-arrow-left"></i>

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
